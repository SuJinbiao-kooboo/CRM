# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.0
  # 版权年份
  copyrightYear: 2025
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8081
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关：已关闭（热重启约30秒且偶尔因类加载器冲突失败导致接口不可用；
      # 代码改动后请手动重启服务生效）
      enabled: false

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 144000

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

wx:
  miniapp:
    configs:
      - appid: #微信小程序的appid
        secret: #微信小程序的Secret
        token: #微信小程序消息服务器配置的token
        aesKey: #微信小程序消息服务器配置的EncodingAESKey
        msgDataFormat: JSON

# 企业邮箱邮件读取配置（账号密码等信息在此统一配置，已给默认值，可按需修改；
# 生产环境建议通过环境变量注入账号密码等敏感信息，避免明文落盘）
eke:
  mail:
    read:
      # IMAP收件服务器地址（可用环境变量 EKE_MAIL_IMAP_HOST 覆盖）
      imap-host: ${EKE_MAIL_IMAP_HOST:imapv.global-mail.cn}
      # IMAP端口（SSL，可用环境变量 EKE_MAIL_IMAP_PORT 覆盖）
      imap-port: ${EKE_MAIL_IMAP_PORT:993}
      # 邮箱账号（可用环境变量 EKE_MAIL_USERNAME 覆盖）
      username: ${EKE_MAIL_USERNAME:eke@meelectronic.cn}
      # 邮箱密码（可用环境变量 EKE_MAIL_PASSWORD 覆盖）
      password: ${EKE_MAIL_PASSWORD:emailME123}
      # 读取的邮件文件夹（收件箱）
      folder: INBOX
      # 附件保存目录（按日期自动分子目录）
      attachment-path: D:/ruoyi/uploadPath/email-attachments
      # 参数配置 eke_email_last_read_time 不存在或格式不合法时，默认往前读取的小时数
      default-lookback-hours: 24
      # 邮件类型匹配规则字典类型（字典value=类型编码、label=类型中文名、remark=逗号分隔的关键词，按字典排序匹配）
      type-dict-type: eke_email_type_dict
      # 单次读取邮件的数量上限：邮件数超限时本次只读最新的N封且不更新参数，剩余邮件下次调用继续读取
      max-emails-per-read: 500
      # 发件人过滤规则：发件人地址模糊匹配该值（如内部域名 meelectronic.cn）时跳过该邮件，不读取不返回；留空则不过滤
      # （可用环境变量 EKE_MAIL_SENDER_FILTER 覆盖）
      sender-filter: ${EKE_MAIL_SENDER_FILTER:meelectronic.cn}
      # 发件人邮箱过滤规则字典类型（第一优先级：字典value=类型编码与主题字典一致、label=类型中文名、remark=逗号拼接的邮箱地址，发件人命中直接归类）
      filter-email-dict-type: eke_email_filter_email_special

# DeepSeek AI 接口配置（Offer AI智能录入使用；生产环境建议通过环境变量注入 api-key，避免明文落盘）
deepseek:
  # API Key（可用环境变量 DEEPSEEK_API_KEY 覆盖；为空时AI录入功能不可用）
  api-key: ${DEEPSEEK_API_KEY:}
  # 接口地址（OpenAI兼容格式，可用环境变量 DEEPSEEK_BASE_URL 覆盖）
  base-url: ${DEEPSEEK_BASE_URL:https://token-factory.hon-maas.com/v1}
  # 模型名称（可用环境变量 DEEPSEEK_MODEL 覆盖）
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash-0731}

# 飞书机器人（ruoyi-feishu 模块）
feishu:
  # 是否随项目启动自动开启机器人
  enabled: true
  # 飞书自建应用凭证
  app-id: cli_aa46fffc27b85bd8
  app-secret: ${FEISHU_APP_SECRET:}
  # 机器人名称
  bot-name: Eke
  # 飞书开放平台地址（国内默认）
  domain: https://open.feishu.cn
  # 定时自动汇报间隔（分钟，0=关闭）
  report-interval-minutes: 0
  # 自测接收目标（可选，方便接口自测发送）
  self-test-receive-id: ''
  self-test-receive-type: chat_id

  # 飞书指挥 Codex（非交互 codex exec）
  codex:
    # 是否启用：false 时收到 codex 指令会当作普通回答处理
    enabled: true
    # codex 可执行文件路径（默认使用 PATH 中的 codex）
    bin: codex
    # Codex 工作目录（目标项目根目录）
    workdir: C:/Project/RuoYi-Vue
    # 沙箱模式：read-only / workspace-write / danger-full-access
    sandbox: danger-full-access
    # 单次执行超时（秒）
    timeout-seconds: 300
    # 产出目录：Codex 结束后的产出文件会发回飞书（可留空关闭）
    output-directory: C:/Project/RuoYi-Vue/feishu-output



# ===== CRM 订单单据生成 =====
order:
  # PO 模板路径（classpath）
  po-template: order-template/PO-Purchasing Order template.xlsx
